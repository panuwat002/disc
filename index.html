<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รู้จักตัวเอง DISC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Pridi:wght@500;600&display=swap">

<style>
/* พื้นฐานที่ต้องมี — ห้ามลบ
   [hidden] ต้องเป็น !important ไม่งั้นจะแพ้ display:flex ของ .intro
   แล้วหน้าแรกกับหน้าคำถามจะโผล่ซ้อนกัน */
:root {
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: คอลัมน์เดียวกลางจอ สูงสุด 40rem — ทีละ 1 คำถามเต็มหน้าจอ แถบความคืบหน้าติดบนสุด
   สีสันทั้งหมดถูกเก็บไว้ที่หน้าผลลัพธ์ หน้าตอบคำถามใช้หมึกเรียบ ๆ ให้โฟกัสที่ข้อความ */
:root {
  --bg: #F5F7F5;
  --surface: #FFFFFF;
  --surface-2: #EDF1EE;
  --fg: #16211F;
  --muted: #5C6B68;
  --line: #DCE3DF;
  --line-strong: #C2CCC7;
  --accent: #27463F;
  --accent-fg: #FFFFFF;
  --focus: #1F7A6B;
  --warn: #9A5B00;

  --d: #B8303C;
  --i: #D9A016;
  --s: #13885F;
  --c: #3F6DB5;

  --font-display: "Pridi", Georgia, serif;
  --font-body: "IBM Plex Sans Thai", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715;
    --surface: #19211F;
    --surface-2: #212B28;
    --fg: #E7EDEA;
    --muted: #9BAAA5;
    --line: #2B3733;
    --line-strong: #3C4A45;
    --accent: #7FC9B8;
    --accent-fg: #0E1715;
    --focus: #7FC9B8;
    --warn: #E0A95C;
    --d: #DB5A63;
    --i: #B28712;
    --s: #1FA477;
    --c: #6E93E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715;
  --surface: #19211F;
  --surface-2: #212B28;
  --fg: #E7EDEA;
  --muted: #9BAAA5;
  --line: #2B3733;
  --line-strong: #3C4A45;
  --accent: #7FC9B8;
  --accent-fg: #0E1715;
  --focus: #7FC9B8;
  --warn: #E0A95C;
  --d: #DB5A63;
  --i: #B28712;
  --s: #1FA477;
  --c: #6E93E0;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}

.wrap {
  max-width: 40rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}

h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.35; }

.eyebrow {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

/* ---------- ปุ่ม ---------- */
.btn {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  border-radius: 10px;
  border: 1px solid transparent;
  padding: 13px 24px;
  cursor: pointer;
  background: var(--accent);
  color: var(--accent-fg);
  transition: opacity .15s ease;
}
.btn:hover { opacity: .88; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-quiet {
  background: transparent;
  color: var(--muted);
  border-color: var(--line-strong);
  padding: 9px 16px;
  font-size: 14px;
}
.btn-quiet:hover { color: var(--fg); }
:where(button, a, input, select, [tabindex]):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ---------- หน้าเริ่ม ---------- */
.intro { padding-block: 44px 0; display: flex; flex-direction: column; gap: 24px; }
.banner {
  margin: 0;
  padding: 13px 15px;
  border: 1px solid var(--warn);
  border-left-width: 4px;
  border-radius: 8px;
  background: var(--surface);
  font-size: 14px;
  line-height: 1.6;
}
.banner b { display: block; margin-bottom: 3px; }
.banner a { color: var(--focus); word-break: break-all; }
.intro h1 { font-size: clamp(30px, 7vw, 42px); }
.intro p { margin: 0; color: var(--muted); max-width: 34rem; }
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 28px;
  padding: 18px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.fact { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact b { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact span { font-size: 13px; color: var(--muted); }

/* ---------- ฟอร์มผู้ตอบ ---------- */
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field .req { color: var(--d); }
.field input[type="text"], .field input[type="email"], .field select {
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  padding: 11px 13px;
  width: 100%;
  min-width: 0;
}
.field input::placeholder { color: var(--muted); opacity: .8; }
.consent {
  display: grid;
  grid-template-columns: 20px 1fr;
  gap: 12px;
  align-items: start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
}
.consent input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--focus); }
.consent-text { font-size: 14px; }
.consent-text b { display: block; margin-bottom: 4px; }
.consent-text span { color: var(--muted); }
.err { font-size: 14px; color: var(--d); }

.styles-peek { display: grid; gap: 10px; }
.peek {
  display: grid;
  grid-template-columns: 10px 1fr;
  gap: 14px;
  align-items: start;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.peek i { display: block; width: 10px; height: 10px; border-radius: 3px; margin-top: 8px; }
.peek-name { font-weight: 600; }
.peek-desc { font-size: 14px; color: var(--muted); }

/* ---------- แถบความคืบหน้า ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 9;
  background: var(--bg);
  padding-block: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.topbar-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.track { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s ease; }

/* ---------- คำถาม ---------- */
.q-head { padding-block: 24px 20px; }
.q-head h2 { font-size: clamp(21px, 4.6vw, 26px); }
.options { display: grid; gap: 10px; }
.opt {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  text-align: left;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px 16px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 12px;
  align-items: start;
  transition: border-color .12s ease, background .12s ease;
}
.opt:hover { border-color: var(--line-strong); background: var(--surface-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt kbd {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  margin-top: 2px;
}
.q-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 20px; }
.hint { font-size: 13px; color: var(--muted); }

/* ---------- ผลลัพธ์ ---------- */
.result { padding-block: 28px 0; display: flex; flex-direction: column; gap: 26px; }
.who { font-size: 14px; color: var(--muted); }
.who b { color: var(--fg); font-weight: 600; }

.savebar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  font-size: 14px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.savebar .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.savebar.ok .dot { background: var(--s); }
.savebar.bad .dot { background: var(--warn); }
.savebar.ok { border-color: var(--s); }
.savebar.bad { border-color: var(--warn); }

.verdict {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 26px 22px;
  background: var(--surface);
  border-top: 5px solid var(--hue, var(--accent));
}
.verdict .eyebrow { margin-bottom: 10px; }
.verdict h1 { font-size: clamp(27px, 6.4vw, 36px); color: var(--hue, var(--fg)); }
.verdict .latin { font-size: 14px; color: var(--muted); margin: 4px 0 14px; letter-spacing: .02em; }
.verdict p { margin: 0; }

.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 1fr; gap: 6px; }
.bar-label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.bar-label .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar-label .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.bar-label .val { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.bar-track { height: 12px; background: var(--surface-2); border-radius: 4px; }
.bar-fill { height: 100%; border-radius: 4px; min-width: 4px; transition: width .5s ease; }

.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 20px 18px; display: grid; gap: 18px; }
.panel h3 { font-size: 17px; }
.panel ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.panel li::marker { color: var(--muted); }
.second { font-size: 15px; color: var(--muted); }
.second b { color: var(--fg); font-weight: 600; }

.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toast { font-size: 13px; color: var(--focus); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="wrap">

  <!-- หน้าเริ่ม -->
  <section id="screen-intro" class="intro">
    <p class="banner" id="demo-note" hidden></p>
    <div>
      <p class="eyebrow" id="intro-eyebrow"></p>
      <h1 id="intro-title"></h1>
    </div>
    <p id="intro-lead"></p>
    <div class="facts">
      <div class="fact"><b id="fact-total">37</b><span>คำถาม</span></div>
      <div class="fact"><b id="fact-mins">7</b><span>นาทีโดยประมาณ</span></div>
      <div class="fact"><b>4</b><span>สไตล์พฤติกรรม</span></div>
    </div>

    <div class="form" id="form"></div>

    <div class="consent">
      <input type="checkbox" id="consent">
      <label class="consent-text" for="consent">
        <b>ยินยอมให้เก็บข้อมูล</b>
        <span id="consent-text"></span>
      </label>
    </div>
    <p class="err" id="form-err" hidden></p>

    <div>
      <button class="btn" id="btn-start">เริ่มทำแบบประเมิน</button>
    </div>

    <div class="styles-peek" id="peek"></div>
  </section>

  <!-- หน้าคำถาม -->
  <section id="screen-quiz" hidden>
    <div class="topbar">
      <div class="topbar-row">
        <span id="counter">ข้อ 1 จาก 37</span>
        <span id="pct">0%</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="q-head">
      <h2 id="q-text"></h2>
    </div>
    <div class="options" id="options"></div>
    <div class="q-foot">
      <button class="btn btn-quiet" id="btn-back">ย้อนกลับ</button>
      <span class="hint">กดเลข 1–4 บนคีย์บอร์ดก็ได้</span>
    </div>
  </section>

  <!-- หน้าผลลัพธ์ -->
  <section id="screen-result" hidden>
    <div class="result">
      <p class="who" id="who"></p>
      <div class="panel" id="thanks" hidden></div>
      <div class="savebar" id="savebar" hidden>
        <span class="dot"></span>
        <span id="save-msg"></span>
        <button class="btn btn-quiet" id="btn-retry" hidden>ส่งอีกครั้ง</button>
      </div>

      <div class="verdict" id="verdict"></div>

      <div id="bars-block">
        <p class="eyebrow" style="margin-bottom:12px" id="bars-title">คะแนนทั้ง 4 ด้าน</p>
        <div class="bars" id="bars"></div>
      </div>

      <p class="second" id="second"></p>

      <div class="panel" id="detail"></div>

      <div class="actions" id="actions">
        <button class="btn btn-quiet" id="btn-copy">คัดลอกผลลัพธ์</button>
        <button class="btn btn-quiet" id="btn-again">ทำใหม่อีกครั้ง</button>
        <span class="toast" id="toast" hidden>คัดลอกแล้ว</span>
      </div>

      <p class="note" id="result-note">คะแนนที่ออกมาบอกว่าคุณ “มักจะ” ทำแบบไหน ไม่ได้แปลว่าคุณทำแบบอื่นไม่ได้ คนส่วนใหญ่มีสองสไตล์ผสมกัน และพฤติกรรมเปลี่ยนได้ตามสถานการณ์และช่วงชีวิต</p>
    </div>
  </section>

</div>

<script>
"use strict";

/* =========================================================================
   ตั้งค่า — แก้ได้แค่ในบล็อกนี้ ส่วนอื่นไม่ต้องแตะ
   ========================================================================= */

/* 1) URL ของ Google Apps Script ที่ deploy แล้ว (ดูขั้นตอนใน docs/setup-google-sheets.md)
      ถ้าเว้นว่างไว้ เว็บจะทำงานปกติแต่ไม่ส่งข้อมูลไปไหน */
var ENDPOINT = "https://script.google.com/macros/s/AKfycbxLHomG2plbQ_Dh3CQtLyAqf_is2vEshDBos0DUNdFIKp-2xdWpNM8a-8WjiPBEblypZQ/exec";

/* 2) รายชื่อแผนก (สำหรับพนักงาน) — ใส่แล้วจะกลายเป็นเมนูให้เลือก ถ้าเว้น [] ไว้ จะเป็นช่องพิมพ์เอง
      ตัวอย่าง: ["ฝ่ายขาย", "ฝ่ายผลิต", "ฝ่ายบัญชี", "ฝ่ายบุคคล"] */
var DEPARTMENTS = [];

/* 3) รายชื่อตำแหน่งที่เปิดรับ (สำหรับผู้สมัครงาน)
      ต้องสะกดให้ตรงกับใน Code.gs เป๊ะ ๆ ไม่งั้นระบบจะหาโปรไฟล์ของตำแหน่งไม่เจอ */
var JOBS = [
  "พนักงานขาย",
  "เจ้าหน้าที่บัญชี",
  "เจ้าหน้าที่ธุรการ",
  "เจ้าหน้าที่บริการลูกค้า",
  "หัวหน้าสายการผลิต",
  "เจ้าหน้าที่คลังสินค้า",
  "เจ้าหน้าที่ไอที"
];

/* 4) ข้อมูลที่ขอจากผู้ตอบ — เพิ่ม/ลบบรรทัดได้ตามต้องการ
      type: "text" | "email" | "select"  ·  required: true = ต้องกรอก */
var EMPLOYEE_FIELDS = [
  { key: "name",       label: "ชื่อ-สกุล", type: "text",   required: true,  placeholder: "เช่น สมชาย ใจดี" },
  { key: "department", label: "แผนก",      type: "select", required: true,  options: DEPARTMENTS, placeholder: "เช่น ฝ่ายขาย" }
  /* ตัวอย่างที่เพิ่มได้:
  { key: "position",   label: "ตำแหน่ง",      type: "text",  required: false, placeholder: "เช่น หัวหน้าทีม" },
  { key: "employeeId", label: "รหัสพนักงาน",  type: "text",  required: true,  placeholder: "เช่น EMP-0123" },
  { key: "email",      label: "อีเมลที่ทำงาน", type: "email", required: false, placeholder: "เช่น somchai@company.co.th" }
  */
];

var APPLICANT_FIELDS = [
  { key: "name",     label: "ชื่อ-สกุล",        type: "text",   required: true, placeholder: "เช่น สมชาย ใจดี" },
  { key: "position", label: "ตำแหน่งที่สมัคร",  type: "select", required: true, options: JOBS, placeholder: "เช่น พนักงานขาย" }
];

/* 5) ข้อความขอความยินยอม PDPA — ให้ HR หรือฝ่ายกฎหมายตรวจก่อนใช้งานจริง */

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildDeck() {
  deck = QUESTIONS.map(function () { return { order: shuffle([0, 1, 2, 3]) }; });
  answers = new Array(TOTAL).fill(null);
  idx = 0;
}

function show(name) {
  el("screen-intro").hidden = name !== "intro";
  el("screen-quiz").hidden = name !== "quiz";
  el("screen-result").hidden = name !== "result";
  window.scrollTo(0, 0);
}

/* ===== หน้าเริ่ม ===== */
function renderForm() {
  var box = el("form");
  box.innerHTML = "";
  FIELDS.forEach(function (f) {
    var wrap = document.createElement("div");
    wrap.className = "field";

    var lab = document.createElement("label");
    lab.setAttribute("for", "f-" + f.key);
    lab.textContent = f.label;
    if (f.required) {
      var star = document.createElement("span");
      star.className = "req";
      star.textContent = " *";
      lab.appendChild(star);
    }
    wrap.appendChild(lab);

    var input;
    if (f.type === "select" && f.options && f.options.length) {
      input = document.createElement("select");
      var blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "— เลือก" + f.label + " —";
      input.appendChild(blank);
      f.options.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o;
        op.textContent = o;
        input.appendChild(op);
      });
      var other = document.createElement("option");
      other.value = "อื่น ๆ";
      other.textContent = "อื่น ๆ";
      input.appendChild(other);
    } else {
      input = document.createElement("input");
      input.type = f.type === "email" ? "email" : "text";
      if (f.placeholder) input.placeholder = f.placeholder;
      input.autocomplete = f.key === "name" ? "name" : "off";
    }
    input.id = "f-" + f.key;
    input.dataset.key = f.key;
    wrap.appendChild(input);
    box.appendChild(wrap);
  });
}

function readForm() {
  var out = {};
  var missing = [];
  FIELDS.forEach(function (f) {
    var node = el("f-" + f.key);
    var v = node ? String(node.value || "").trim() : "";
    out[f.key] = v;
    if (f.required && !v) missing.push(f.label);
  });
  return { values: out, missing: missing };
}

function renderPeek() {
  el("peek").innerHTML = ORDER.map(function (k) {
    var s = STYLES[k];
    return '<div class="peek"><i style="background:var(--' + k.toLowerCase() + ')"></i>' +
           '<div><div class="peek-name">' + s.name + ' · ' + s.animal + '</div>' +
           '<div class="peek-desc">' + s.latin + ' — ' + s.desc + '</div></div></div>';
  }).join("");
}

/* ===== หน้าคำถาม ===== */
function renderQuestion() {
  var q = QUESTIONS[idx];
  el("counter").textContent = "ข้อ " + (idx + 1) + " จาก " + TOTAL;
  var pct = Math.round((idx / TOTAL) * 100);
  el("pct").textContent = pct + "%";
  el("fill").style.width = pct + "%";
  el("q-text").textContent = q.t;
  el("btn-back").style.visibility = idx === 0 ? "hidden" : "visible";

  var box = el("options");
  box.innerHTML = "";
  deck[idx].order.forEach(function (original, i) {
    var b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.setAttribute("aria-pressed", answers[idx] === original ? "true" : "false");
    var k = document.createElement("kbd");
    k.textContent = String(i + 1);
    var sp = document.createElement("span");
    sp.textContent = q.o[original];
    b.appendChild(k);
    b.appendChild(sp);
    b.addEventListener("click", function () { pick(original); });
    box.appendChild(b);
  });
}

function pick(original) {
  answers[idx] = original;
  if (idx < TOTAL - 1) { idx++; renderQuestion(); }
  else { finish(); }
}

function back() {
  if (idx > 0) { idx--; renderQuestion(); }
}

document.addEventListener("keydown", function (e) {
  if (el("screen-quiz").hidden) return;
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    e.preventDefault();
    pick(deck[idx].order[n - 1]);
  }
});

    v.innerHTML = '<p class="eyebrow">สไตล์หลักของคุณ</p>' +
      '<h1>' + label(s.key) + '</h1>' +
      '<p class="latin">' + s.key + ' — ' + s.latin + ' · ' + r.top + ' จาก ' + TOTAL + ' ข้อ</p>' +
      '<p>' + s.desc + '</p>';
  } else {
    v.style.setProperty("--hue", "var(--" + r.winners[0].toLowerCase() + ")");
    v.innerHTML = '<p class="eyebrow">สไตล์หลักของคุณเสมอกัน ' + r.winners.length + ' แบบ</p>' +
      '<h1>' + r.winners.map(label).join(" + ") + '</h1>' +
      '<p class="latin">แต่ละแบบได้ ' + r.top + ' จาก ' + TOTAL + ' ข้อเท่ากัน</p>' +
      '<p>' + r.winners.map(function (k) { return STYLES[k].desc; }).join(" และ ") + '</p>';
  }

  var max = Math.max(1, r.top);
  el("bars").innerHTML = r.ranked.map(function (k) {
    var w = Math.round((counts[k] / max) * 100);
    return '<div class="bar-row">' +
      '<div class="bar-label"><span class="nm"><span class="sw" style="background:var(--' + k.toLowerCase() + ')"></span>' +
      label(k) + '</span><span class="val">' + counts[k] + ' ข้อ</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%;background:var(--' + k.toLowerCase() + ')"></div></div>' +
      '</div>';
  }).join("");

  var secondEl = el("second");
  if (r.winners.length > 1) {
    secondEl.textContent = "เมื่อสไตล์หลักเสมอกัน แปลว่าคุณยืดหยุ่นและปรับตัวตามสถานการณ์ได้ดี ลองอ่านคำอธิบายของทุกแบบที่เสมอกัน";
  } else if (!r.seconds.length) {
    secondEl.textContent = "คุณตอบไปทางสไตล์เดียวแทบทั้งหมด ไม่มีสไตล์รองที่ชัดเจน";
  } else {
    secondEl.innerHTML = "สไตล์รองของคุณคือ <b>" + r.seconds.map(label).join(" และ ") +
      "</b> (" + counts[r.seconds[0]] + " ข้อ) — คนส่วนใหญ่ใช้สองสไตล์นี้สลับกันตามสถานการณ์";
  }

  el("detail").innerHTML = r.winners.map(function (k) {
    var s = STYLES[k];
    return '<div><h3>' + label(k) + '</h3>' +
      '<div style="margin-top:10px"><strong>จุดแข็ง</strong><ul>' +
        s.strong.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul></div>' +
      '<div style="margin-top:14px"><strong>จุดที่ควรระวัง</strong><ul>' +
        s.watch.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul></div>' +
      '</div>';
  }).join("");

  el("fill").style.width = "100%";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (m) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m];
  });
}

/* ===== ส่งข้อมูลเข้า Google Sheets ===== */
function buildPayload() {
  var p = {
    mode: MODE,
    submittedAt: new Date().toISOString(),
    durationSec: startedAt ? Math.round((Date.now() - startedAt) / 1000) : null,
    totalQuestions: TOTAL,
    /* ลำดับตัวเลือกต้นฉบับที่เลือกในแต่ละข้อ เช่น "0231..." (x = ยังไม่ได้ตอบ)
       ตัวเลขพวกนี้ไม่มีความหมายถ้าไม่มีเฉลยซึ่งอยู่ฝั่ง Google */
    picks: answers.map(function (a) { return a === null ? "x" : String(a); }).join("")
  };
  FIELDS.forEach(function (f) { p[f.key] = person[f.key] || ""; });
  return p;
}

function setSaveState(state, msg) {
  var bar = el("savebar");
  bar.hidden = false;
  bar.className = "savebar" + (state ? " " + state : "");
  el("save-msg").textContent = msg;
  el("btn-retry").hidden = state !== "bad";
}

function send() {
  if (sending) return;
  sending = true;
  setSaveState("", IS_APPLICANT ? "กำลังบันทึกคำตอบ…" : "กำลังบันทึกและคำนวณผล…");

  fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(lastPayload)
  }).then(function (res) {
    return res.json().catch(function () { return { ok: res.ok }; });
  }).then(function (data) {
    sending = false;
    if (!data || !data.ok) {
      setSaveState("bad", "ระบบตอบกลับว่าบันทึกไม่สำเร็จ กดส่งอีกครั้งได้");
      return;
    }
    setSaveState("ok", IS_APPLICANT ? "บันทึกคำตอบเรียบร้อยแล้ว" : "บันทึกผลเรียบร้อยแล้ว");
    if (!IS_APPLICANT && data.result) {
      result = data.result;
      renderResult();
    }
  }).catch(function () {
    sending = false;
    setSaveState("bad", IS_APPLICANT
      ? "ส่งข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วกดส่งอีกครั้ง"
      : "ส่งข้อมูลไม่สำเร็จ จึงยังคำนวณผลให้ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วกดส่งอีกครั้ง");
  });
}

/* โหมดผู้สมัครงาน: ไม่แสดงผล DISC ให้ผู้ตอบเห็น
   เพราะถ้าเห็นว่าตัวเองออกมาเป็นสไตล์ไหน จะเดาได้ทันทีว่าควรตอบใหม่อย่างไร
   ผลเต็มไปโผล่ที่ฝ่ายบุคคลใน Google Sheets แทน */
function renderThanks() {
  setResultBody(false);

  var name = person.name ? escapeHtml(person.name) : "";
  var job = person.position ? escapeHtml(person.position) : "";
  el("who").innerHTML = "";

  el("thanks").hidden = false;
  el("thanks").innerHTML =
    '<div>' +
      '<h3>ขอบคุณที่สละเวลาทำแบบสอบถาม' + (name ? " คุณ" + name : "") + '</h3>' +
      '<p style="margin:10px 0 0">บันทึกคำตอบของคุณเรียบร้อยแล้ว' +
        (job ? ' สำหรับตำแหน่ง <strong>' + job + '</strong>' : '') +
      '</p>' +
      '<p style="margin:10px 0 0;color:var(--muted)">คำตอบชุดนี้จะถูกใช้เป็นหัวข้อพูดคุยในวันสัมภาษณ์ ' +
      'ไม่มีคะแนนผ่านหรือไม่ผ่าน และไม่ได้ใช้ตัดสินผลการรับเข้าทำงาน ' +
      'ทีมงานจะติดต่อกลับตามขั้นตอนการสรรหาต่อไป</p>' +
      '<p style="margin:14px 0 0;color:var(--muted);font-size:14px">ปิดหน้านี้ได้เลยครับ</p>' +
    '</div>';
}

function finish() {
  lastPayload = buildPayload();
  el("fill").style.width = "100%";
  show("result");

  if (IS_APPLICANT) {
    renderThanks();
    if (SAVE_ENABLED) send();
    else if (ON_CLAUDE) setSaveState("", "ลิงก์ตัวอย่าง — ไม่มีการบันทึกข้อมูลใด ๆ");
    else el("savebar").hidden = true;
    return;
  }

  /* โหมดพนักงาน — ซ่อนผลไว้ก่อนจนกว่า Google จะคำนวณกลับมา */
  el("thanks").hidden = true;
  setResultBody(false);

  if (SAVE_ENABLED) {
    send();
  } else {
    result = SAMPLE_RESULT;
    renderResult();
    setSaveState("", ON_CLAUDE
      ? "ลิงก์ตัวอย่าง — ตัวเลขด้านล่างเป็นค่าสมมติ ไม่ได้คำนวณจากคำตอบที่เพิ่งกด"
      : "ยังไม่ได้ตั้งค่าปลายทาง จึงแสดงเป็นผลตัวอย่างด้วยตัวเลขสมมติ");
  }
}

function resultText() {
  if (!result) return "";
  var lines = ["ผลแบบประเมินพฤติกรรม DISC (" + TOTAL + " ข้อ)"];
  FIELDS.forEach(function (f) {
    if (person[f.key]) lines.push(f.label + ": " + person[f.key]);
  });
  lines.push("");
  result.ranked.forEach(function (k) {
    lines.push(label(k) + " (" + k + ") — " + result.counts[k] + " ข้อ");
  });
  lines.push("");
  lines.push("สไตล์หลัก: " + result.winners.map(label).join(" + "));
  if (result.seconds && result.seconds.length) {
    lines.push("สไตล์รอง: " + result.seconds.map(label).join(" + "));
  }
  return lines.join("\n");
}

/* ===== ปุ่ม ===== */
el("btn-start").addEventListener("click", function () {
  var form = readForm();
  var errs = [];
  if (form.missing.length) errs.push("กรุณากรอก " + form.missing.join(" และ "));
  if (!el("consent").checked) errs.push("กรุณาติ๊กยินยอมให้เก็บข้อมูลก่อนเริ่มทำ");
  var errBox = el("form-err");
  if (errs.length) {
    errBox.hidden = false;
    errBox.textContent = errs.join(" · ");
    return;
  }
  errBox.hidden = true;
  person = form.values;
  startedAt = Date.now();
  buildDeck();
  renderQuestion();
  show("quiz");
});

el("btn-back").addEventListener("click", back);
el("btn-retry").addEventListener("click", send);

el("btn-again").addEventListener("click", function () {
  buildDeck();
  lastPayload = null;
  result = null;
  el("savebar").hidden = true;
  show("intro");
});

el("btn-copy").addEventListener("click", function () {
  var text = resultText();
  var done = function () {
    var t = el("toast");
    t.hidden = false;
    setTimeout(function () { t.hidden = true; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
});

function fallbackCopy(text, done) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (err) { /* เงียบไว้ */ }
  document.body.removeChild(ta);
}

/* ===== เริ่มต้น ===== */
/* ตัวเลขทุกตัวที่โชว์บนหน้าจอคิดจากจำนวนคำถามจริง
   เพิ่มหรือลดคำถามแล้วหน้าเว็บปรับตามเอง ไม่ต้องไล่แก้ทีละจุด */
el("intro-eyebrow").textContent = INTRO.eyebrow;
el("intro-title").textContent = INTRO.title;
el("intro-lead").textContent = INTRO.lead.replace("{n}", TOTAL);
el("fact-total").textContent = String(TOTAL);
el("fact-mins").textContent = String(Math.max(1, Math.round(TOTAL * 11 / 60)));
el("bars-title").textContent = "คะแนนทั้ง 4 ด้าน จาก " + TOTAL + " ข้อ";
el("counter").textContent = "ข้อ 1 จาก " + TOTAL;
el("consent-text").textContent = CONSENT_TEXT;
renderForm();
buildDeck();

if (IS_APPLICANT) {
  /* ไม่โชว์คำอธิบาย 4 สไตล์ให้ผู้สมัครเห็นก่อนทำ ไม่งั้นจะรู้ว่าต้องตอบทางไหน */
  el("peek").hidden = true;
} else {
  renderPeek();
}

if (!SAVE_ENABLED) {
  var note = el("demo-note");
  var liveLink = LIVE_URL
    ? ' ถ้าต้องการทำแบบประเมินจริง ให้ใช้ลิงก์นี้แทน<br><a href="' + LIVE_URL +
      (IS_APPLICANT ? "?for=applicant" : "") + '">' + LIVE_URL +
      (IS_APPLICANT ? "?for=applicant" : "") + '</a>'
    : "";

  note.hidden = false;
  note.innerHTML = ON_CLAUDE
    ? "<b>นี่คือลิงก์ตัวอย่าง ไว้ดูหน้าตาเท่านั้น</b>ทำจนจบได้ แต่คำตอบจะไม่ถูกบันทึก และคะแนนที่เห็นเป็นตัวเลขสมมติ" + liveLink
    : "<b>ยังไม่ได้ตั้งค่าปลายทางสำหรับบันทึกข้อมูล</b>หน้านี้จึงแสดงผลอย่างเดียว ไม่ส่งข้อมูลไปไหน และคะแนนที่เห็นเป็นตัวเลขสมมติ";
}
